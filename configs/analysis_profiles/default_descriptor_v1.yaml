# Explicit analysis profile for implemented acoustic descriptors.
# No silent generic defaults — all parameters recorded on DescriptorResult.

profile_id: PROFILE_DEFAULT_DESCRIPTOR_V1
implementation_version: descriptor_backend_v1
method_ids:
  spectral_centroid: spectral_centroid_v1
  spectral_slope: spectral_slope_logfreq_db_linreg_v1
  hnr: hnr_spectral_mask_v1
  spectral_flux: spectral_flux_l1_halfwave_v1
  frame_spectral_variance: frame_spectral_variance_centroid_v1
  ltas: ltas_mean_power_v1
  partial_salience: partial_peak_salience_v1
  pitch_component_count: pitch_component_count_v1

sample_rate_hz: 44100
fft_size: 4096
window_type: hann
hop_size: 1024
frequency_min_hz: 50.0
frequency_max_hz: null  # Nyquist when null
weighting: power  # magnitude | power — used by centroid
normalize_spectrum: false
silence_rms_threshold: 1.0e-8
silence_policy: return_nan
temporal_aggregation: mean_over_frames
amplitude_power_convention: linear_amplitude_time_domain__power_spectrum_frequency_domain

centroid:
  weighting: power

slope:
  frequency_axis: logarithmic
  level_axis: decibel_power
  exclude_dc: true
  min_hz: 100.0
  max_hz: 5000.0

hnr:
  definition: spectral_mask_harmonic_vs_residual
  f0_hz: null  # required at call time or estimated
  n_harmonics: 10
  harmonic_halfwidth_bins: 2

flux:
  normalize_frames: true
  half_wave_rectify: true
  distance: L1

variance:
  feature: spectral_centroid_hz

ltas:
  averaging_domain: power
  output_units: power_linear_mean
  normalize: false

partials:
  peak_prominence_ratio: 0.05
  min_separation_hz: 20.0
  amplitude_threshold_ratio: 0.02
  frequency_tolerance_hz: 5.0
  octave_equivalence: false
  octave_log2_tolerance: 0.08
  noise_floor_percentile: 20.0

attenuation:
  amplitude_function: twenty_log10
  power_function: ten_log10
