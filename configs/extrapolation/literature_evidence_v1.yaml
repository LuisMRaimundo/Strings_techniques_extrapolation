# Literature-evidence table for narrow technique extrapolation (priority 1).
# Numeric values are NEVER applied as EWSD multipliers unless density_mapping is direct.
# Heavy practice mutes, multiphonics, flautando, on-bridge, afterlength are out of scope.

version: "1.0.0"
schema_version: "extrapolation_literature_evidence_v1"
scope_note: >
  First-priority transformations only: ordinario→sul_tasto, ordinario→sul_ponticello,
  ordinario→standard_con_sordino. Instrument- and technique-specific.

