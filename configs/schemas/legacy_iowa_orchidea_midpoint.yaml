collection_id: legacy_iowa_orchidea_midpoint
schema_mapping_version: "1.0"

columns:
  record_id: sample_id
  instrument: instr
  technique: playing_mode
  pitch_name_sounding: sounding_note
  dynamic: dyn
  density_value: acoustic_density
  source_file: filename

constants:
  measured_or_estimated: derived
  metric_definition_id: ewsd_v1
  density_unit: dimensionless
  metric_version: "1.0"
  missingness_status: observed
  provenance: >
    Precomputed combination of upstream IOWA and ORCHIDEA EWSD acoustic-balanced
    ordinary scores (midpoint). Not a direct measurement from a single collection.

value_maps:
  instrument:
    violin: vln
    viola: vla
    cello: vlc
    double_bass: cb
  technique:
    ordinary: ordinary
    ordinary_arco: ordinary
  dynamic:
    pp: pp
    mf: mf
    ff: ff

required_fields:
  - instrument
  - technique
  - pitch_name_sounding
  - dynamic
  - density_value
  - metric_definition_id

missing_value_markers:
  - ""
  - "NA"
  - "NaN"
  - "null"

validation:
  allowed_instruments: [vln, vla, vlc, cb]
  allowed_techniques: [ordinary, artificial_harmonic, sul_ponticello, sul_tasto, con_sordino]
  allowed_dynamics: [pp, p, mp, mf, f, ff]
