  # --- Schoonderwaldt 2009: β definition, measurement-domain separation ---
  - evidence_id: EV_SCHOONDERWALDT_BETA_DEF_001
    source_id: SRC_SCHOONDERWALDT_2009
    instrument: vln
    technique: null
