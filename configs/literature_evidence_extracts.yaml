    page_end: 4
    section_title: relative_bow_bridge_distance_beta_definition
    original_variable_name: relative_bow_bridge_distance_beta
    canonical_variable_name: relative_bow_bridge_distance_beta
    paraphrased_claim: >
      Relative bow-bridge distance β is the ratio of bow-bridge distance to speaking
      length (log-scaled on Schelleng diagrams). It is a primary bow-position coordinate
      alongside bow force and bow velocity; it does not alone determine spectral centroid
      without coordinated force and velocity.
