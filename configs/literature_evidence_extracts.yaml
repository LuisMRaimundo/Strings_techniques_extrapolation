  - evidence_id: EV_SOA_HARM_MECH_001
    source_id: SRC_STRING_TIMBRAL_ARTICULATORY_STATE_OF_ART
    instrument: null
    technique: null
    page_start: 2
    page_end: 3
    section_title: harmonics_natural_artificial_modal_reorganization
    original_variable_name: harmonic_partial_selection
    canonical_variable_name: nodal_formation_and_harmonic_order
    paraphrased_claim: >
      Natural and artificial harmonics reorganize the vibrational regime rather than merely
      quieting the fundamental. Artificial-harmonic touch intervals map to partial order:
      perfect fourth selects the fourth partial; major third, minor third, and perfect fifth
      configurations select the fifth, sixth, and third partials respectively, with the
      perfect-fourth configuration most idiomatic in practice.
    quantitative_or_qualitative: qualitative
    directness: generic_bowed_string_physics
    density_mapping_status: qualitative_constraint_only
    curator_verification_status: validated
    evidence_class: secondary_synthesis
    extraction_method: pdf_page_verified
    curator_notes: Covers both natural and artificial harmonic regimes.

