[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "string-technique-model"
version = "0.1.0"
description = "Literature-informed estimation of acoustic density for extended bowed-string techniques"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "numpy>=1.24,<3",
  "pandas>=2.0,<3",
  "pyyaml>=6.0,<7",
  "scipy>=1.10,<2",
  "pyarrow>=14.0,<20",
  "matplotlib>=3.7,<4",
  "openpyxl>=3.1,<4",
  "pydantic>=2.6,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
  "pytest-cov>=4.1",
  "ruff>=0.6",
  "mypy>=1.10",
  "pandas-stubs>=2.0",
  "types-PyYAML>=6.0",
]
bayes = [
  "pymc>=5",
  "arviz>=0.17",
  "patsy>=0.5",
]

[project.scripts]
string-technique-model = "string_technique_model.cli:main"
string-technique-gui = "string_technique_model.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "acoustics_stress: acoustics stress-testing package",
  "mathematical_exact: exact algebraic / unit identities",
  "unit_consistency: unit conversion consistency",
  "domain_boundary: boundary / invalid domain handling",
  "literature_bounded: verified literature ranges or categorical claims",
  "literature_directional: directional literature claims",
  "measurement_domain: measurement-domain separation",
  "physical_plausibility: physical plausibility / scope",
  "metamorphic: metamorphic relations",
  "adversarial: adversarial / malformed inputs",
  "regression: regression guards",
  "performance: performance / scaling (may be slow)",
  "reproducibility: deterministic / seed stability",
  "provenance: provenance labelling",
  "assumption_isolation: user assumptions vs literature",
  "unsupported_extrapolation: must refuse unsupported inference",
  "benchmark: named Benchmark A–J cases",
  "slow: extended runtime",
]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "UP038", "UP017"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
packages = ["string_technique_model"]
